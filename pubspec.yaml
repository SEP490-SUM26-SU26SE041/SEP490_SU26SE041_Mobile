name: flutter_application_2
description: "Smart Nursery Management System (SNMS) - Production-grade IoT-integrated agricultural research platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_svg: ^2.0.10+1

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Data Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # HTTP
  dio: ^5.4.3

  # UI
  cached_network_image: ^3.3.1
  fl_chart: ^0.68.0
  google_fonts: ^6.1.0

  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
