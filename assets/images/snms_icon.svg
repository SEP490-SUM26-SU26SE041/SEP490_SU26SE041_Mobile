<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Hexagon background -->
  <polygon points="24,2 44,13 44,35 24,46 4,35 4,13" fill="#1B4332"/>

  <!-- Left stem (shorter) -->
  <line x1="17" y1="36" x2="17" y2="24" stroke="#52B788" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M17,26 C13,22 11,18 14,14 C17,10 21,12 17,16" fill="#52B788"/>
  <path d="M17,22 C13,18 13,14 16,11 C19,8 22,10 19,14" fill="#40916C"/>

  <!-- VS divider -->
  <text x="24" y="23" font-family="Arial Black, sans-serif" font-size="6" font-weight="900" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">VS</text>

  <!-- Right stem (taller) -->
  <line x1="31" y1="36" x2="31" y2="19" stroke="#52B788" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M31,21 C27,17 25,13 28,9 C31,5 35,7 32,11" fill="#52B788"/>
  <path d="M31,17 C27,13 27,9 30,6 C33,3 36,5 33,9" fill="#40916C"/>
  <path d="M31,27 C28,24 28,20 30,17 C32,14 35,16 33,19" fill="#40916C"/>

  <!-- BEST badge on taller stem -->
  <circle cx="36" cy="8" r="5" fill="#FF6B35"/>
  <text x="36" y="8" font-family="Arial, sans-serif" font-size="4" font-weight="900" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">BEST</text>

  <!-- Checkmark -->
  <circle cx="38" cy="16" r="3.5" fill="#2D6A4F"/>
  <polyline points="36.2,16.2 37.5,17.5 39.8,15.2" stroke="#52B788" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
