<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" width="320" height="120">
  <!-- Hex icon mark (left side) -->
  <g transform="translate(10, 10)">
    <polygon points="50,2 92,27 92,73 50,98 8,73 8,27" fill="#1B4332"/>
    <!-- Left stem -->
    <line x1="36" y1="78" x2="36" y2="52" stroke="#52B788" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M36,54 C28,46 24,36 30,28 C36,20 44,24 38,32" fill="#52B788"/>
    <path d="M36,46 C28,38 28,28 34,22 C40,16 48,20 42,28" fill="#40916C"/>
    <!-- VS divider -->
    <text x="50" y="48" font-family="Arial Black, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">VS</text>
    <!-- Right stem -->
    <line x1="64" y1="78" x2="64" y2="42" stroke="#52B788" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M64,44 C56,36 52,26 58,18 C64,10 72,14 66,22" fill="#52B788"/>
    <path d="M64,36 C56,28 56,18 62,12 C68,6 76,10 70,18" fill="#40916C"/>
    <path d="M64,56 C58,50 58,42 62,36 C66,30 72,34 68,40" fill="#40916C"/>
    <!-- BEST badge -->
    <circle cx="74" y="16" r="8" fill="#FF6B35"/>
    <text x="74" y="16" font-family="Arial, sans-serif" font-size="6" font-weight="900" fill="#FFFFFF" text-anchor="middle" dominant-baseline="middle">BEST</text>
    <!-- Checkmark -->
    <circle cx="78" cy="30" r="5.5" fill="#2D6A4F"/>
    <polyline points="75.8,30.4 77.5,32 80.5,29" stroke="#52B788" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- SNMS wordmark -->
  <text x="118" y="52" font-family="Arial Black, sans-serif" font-size="42" font-weight="900" fill="#1B4332" letter-spacing="-1">SNMS</text>

  <!-- Subtitle -->
  <text x="120" y="76" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#40916C" letter-spacing="0.5">Smart Nursery Management System</text>

  <!-- Decorative underline -->
  <rect x="118" y="82" width="140" height="2" rx="1" fill="#52B788" opacity="0.5"/>
</svg>
